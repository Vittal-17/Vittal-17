<text x="42" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#C6D5B2" letter-spacing="1.5" >THE OPERATING PRINCIPLE / 01—04</text>
<text x="40" y="98" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#FFFFFD" letter-spacing="-1.7" >One mind. The whole system.</text>
<text x="42" y="124" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#B5B9AF" letter-spacing="0" >Architecture matters. So does the moment someone presses a button.</text>
