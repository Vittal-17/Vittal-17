<!DOCTYPE html>

<title>README Preview — Vittal J G / Vittal-17</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;           /* GitHub dark background */
    display: flex;
    justify-content: center;
    padding: 40px 16px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: #e6edf3;
  }

  /* ── GitHub README container ─────────────────────────────────────────── */
  .readme {
    width: 100%;
    max-width: 860px;
    background: #0d1117;
  }

  /* ── header bar mimicking GitHub's README tab ────────────────────────── */
  .gh-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 0;
  }
  .gh-header svg { flex-shrink: 0; }
  .gh-header strong { color: #e6edf3; }

  /* ── README body ─────────────────────────────────────────────────────── */
  .readme-body {
    background: #0d1117;
    border: 1px solid #30363d;
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 32px;
  }

  /* ── centre-aligned div (mirrors <div align="center">) ──────────────── */
  .center { text-align: center; }

  /* ── card images ─────────────────────────────────────────────────────── */
  .card-full {
    display: block;
    width: 100%;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  /* ── links row — 3 tiles at 32.5% each ──────────────────────────────── */
  .links-row {
    display: flex;
    gap: 1.25%;
    margin-bottom: 10px;
  }
  .links-row a { flex: 0 0 32.5%; display: block; }
  .links-row img { width: 100%; border-radius: 6px; display: block; }

  /* ── section spacer ──────────────────────────────────────────────────── */
  .gap { margin-bottom: 10px; }

  /* ── caption links (mimicking GitHub markdown links) ────────────────── */
  .caption {
    font-size: 13px;
    text-align: center;
    color: #8b949e;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .caption a { color: #58a6ff; text-decoration: none; }
  .caption a:hover { text-decoration: underline; }

  /* ── <sub> tag ───────────────────────────────────────────────────────── */
  sub {
    font-size: 11px;
    color: #8b949e;
    letter-spacing: 0.5px;
  }

  /* ── floating label ──────────────────────────────────────────────────── */
  .preview-label {
    position: fixed;
    top: 12px;
    right: 16px;
    background: #d7ff68;
    color: #171916;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 12px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    z-index: 999;
  }
</style>
</head>
