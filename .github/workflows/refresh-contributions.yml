name: Refresh Contributions

on:
  schedule:
    # 02:30 UTC every day (refreshes daily)
    - cron: "30 2 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install fonttools --quiet

      - name: Fetch real-time contributions and render cards
        run: python3 render_cards.py

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json cards/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh real-time contribution cards [skip ci]"
          git push
