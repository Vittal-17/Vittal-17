name: Refresh Profile Cards

on:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - .github/workflows/refresh-contributions.yml
  schedule:
    # 02:30 UTC every day (refreshes daily)
    - cron: "30 2 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch public GitHub data and render cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 render_cards.py

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json profile-data.json cards/
          git diff --cached --quiet || git commit -m "chore: refresh real-time contribution cards [skip ci]"
          git push
